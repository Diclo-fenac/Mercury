name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/

  integration-boot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Copy env template
        run: cp .env.example .env

      - name: Boot Docker Compose
        run: docker compose up -d

      - name: Check Health and Run Smoke Tests
        run: bash scripts/smoke_test.sh
