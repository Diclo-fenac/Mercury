name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install tools
        run: pip install ruff mypy
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest tests/

  integration-boot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Boot Docker Compose
        run: docker compose up -d
      - name: Check Health and Run Smoke Tests
        run: bash scripts/smoke_test.sh
