services:
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://mercury:mercury_pass@db:5432/mercury}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-dev_key}
      - MINIO_ENDPOINT=
      - WORKERS=4
      - REGION=us-east-1
    volumes:
      - .env:/app/.env:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      typesense:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api-eu:
    build: .
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://mercury:mercury_pass@db:5432/mercury}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-dev_key}
      - MINIO_ENDPOINT=
      - WORKERS=4
      - REGION=eu-west-1
    volumes:
      - .env:/app/.env:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      typesense:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-mercury}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-mercury_pass}
      - POSTGRES_DB=${DB_NAME:-mercury}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mercury} -d ${DB_NAME:-mercury}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server
    ports:
      - "127.0.0.1:6379:6379"

  typesense:
    image: typesense/typesense:26.0
    restart: always
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-dev_key}
      - TYPESENSE_ENABLE_CORS=true
    volumes:
      - ./data/typesense:/data
    ports:
      - "127.0.0.1:8108:8108"
