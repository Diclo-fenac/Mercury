[project]
name = "mercury"
version = "4.0.0"
description = "Mercury AI Assistant - A high-performance AI-powered search and recommendation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis[hiredis]>=5.0.0",
    "google-genai>=0.2.2",
    "typesense>=0.18.0",
    "Pillow>=10.1.0",
    "langdetect>=1.0.9",
    "deep-translator>=1.11.4",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=23.2.0",
    "orjson>=3.9.0",
    "ujson>=5.8.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "prometheus-client>=0.19.0",
    "locust>=2.20.0",
    "minio>=7.2.20",
    "mcp>=1.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/test_api_endpoints.py", "tests/test_admin_endpoints.py"]
addopts = "--ignore=tests/load --ignore=tests/e2e --ignore=tests/integration --ignore=tests/performance"
markers = [
    "integration: requires live PostgreSQL, Redis, Typesense, or storage services",
    "e2e: requires a deployed application and browser tooling",
    "model_backed: requires live or locally downloaded AI models",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "node_modules",
    "dist",
    "build"
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B008", "E402", "B904", "B007", "F841", "F401", "B905", "E712", "E701", "E722"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true
